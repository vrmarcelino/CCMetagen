channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.9
  - ete3
  - six
  - legacy-cgi  # ete3 imports the 'cgi' module, removed from the standard library in Python 3.13
  - pandas
  - kma >=1.6.15  # mapstat parsing (fParseKMA.parse_mapstat_header) is tested against this and later; older KMA also works but is untested here
  - krona
