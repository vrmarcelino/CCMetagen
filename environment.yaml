channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.9,<3.13  # ete3 imports the 'cgi' module, removed in Python 3.13
  - ete3
  - pandas
  - kma >=1.6.15  # mapstat parsing (fParseKMA.parse_mapstat_header) is tested against this and later; older KMA also works but is untested here
  - krona
