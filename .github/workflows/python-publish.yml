# Build CCMetagen and upload it to PyPI when a version tag (v*.*.*) is pushed.
#
# Uses PyPI Trusted Publishing (OIDC): no API token is stored in this repo.
# PyPI trusts this specific workflow instead, configured at
# https://pypi.org/manage/project/ccmetagen/settings/publishing/ with:
#   owner: vrmarcelino   repository: CCMetagen
#   workflow: python-publish.yml   environment: pypi
# Renaming this file or the 'pypi' environment requires updating that config.
#
# Actions are pinned to commit SHAs (the version is in the trailing comment).

name: Upload Python Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.x'
    - name: Build package
      run: |
        python -m pip install --upgrade pip build
        python -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: python-package-distributions
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ccmetagen
    permissions:
      id-token: write  # required for Trusted Publishing; nothing else gets this
    steps:
    - name: Download the distribution packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
